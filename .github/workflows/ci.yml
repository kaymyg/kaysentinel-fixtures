name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: every fixture and validation vector must parse as JSON
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            echo "ok   $f"
          done